<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Student Assessment Card</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --blue:#1579BE;
  --blue-deep:#0F5A8E;
  --maroon:#AE2220;
  --gold:#E3A012;
  --green:#2E7D53;
  --amber:#C1590F;
  --ink:#1B2536;
  --ink-soft:#6b7690;
  --bg:#F5F7FA;
  --card:#FFFFFF;
  --border:#E5E9F0;
  --good-bg:#E6F1EB;
  --watch-bg:#FBEED0;
  --amber-bg:#F7E2D2;
  --risk-bg:#F6E2E1;
}
*{box-sizing:border-box;}
.efb5{
  background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
  padding:24px 20px 40px; border-radius:10px; min-height:100%;
}
.efb5-inner{max-width:640px; margin:0 auto;}

.efb5-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
.efb5-brand{display:flex; align-items:center; gap:10px; min-width:0;}
.efb5-brand img{height:34px; width:auto; display:block; flex-shrink:0;}
.efb5-brand-name{font-size:12.5px; font-weight:700; color:var(--blue-deep); line-height:1.3;}
.efb5-live{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); flex-shrink:0; margin-top:4px;}
@media (max-width:480px){
  .efb5-brand-name{font-size:11px;}
}
.efb5-live-dot{width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0;}
.efb5-live-dot.off{background:var(--maroon);}
.efb5-live-dot.loading{background:var(--gold); animation:efb5Pulse 1s infinite ease-in-out;}
@keyframes efb5Pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

.efb5-search-wrap{position:relative; margin-bottom:16px;}

/* login gate */
.efb5-login{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:24px 22px; text-align:left;
}
.efb5-login-title{font-size:14px; font-weight:600; margin-bottom:14px; color:var(--ink);}
.efb5-login-btn{
  width:100%; margin-top:14px; padding:11px; background:var(--blue); color:#fff;
  border:none; border-radius:8px; font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
  cursor:pointer;
}
.efb5-login-btn:hover{background:var(--blue-deep);}
.efb5-login-error{color:var(--maroon); font-size:12.5px; margin-top:10px;}
.efb5-session-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 4px 14px; font-size:13px;
}
#efb5SessionName{font-weight:600; color:var(--ink);}
.efb5-logout-btn{
  background:none; border:1px solid var(--border); border-radius:20px; padding:5px 12px;
  font-size:12px; font-weight:600; color:var(--blue-deep); cursor:pointer; font-family:'Inter',sans-serif;
}
.efb5-logout-btn:hover{background:var(--bg);}
.efb5-search{
  width:100%; padding:12px 14px; font-size:15px; font-family:'Inter',sans-serif;
  border:1.5px solid var(--border); border-radius:8px; background:var(--card);
  color:var(--ink); outline:none;
}
.efb5-search:focus{border-color:var(--blue);}
.efb5-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  max-height:240px; overflow-y:auto; z-index:20;
  box-shadow:0 10px 24px rgba(20,30,50,0.1);
}
.efb5-result-row{padding:10px 14px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--border);}
.efb5-result-row:last-child{border-bottom:none;}
.efb5-result-row:hover{background:var(--bg);}
.efb5-result-roll{color:var(--ink-soft); font-size:12px; margin-right:6px;}

.efb5-empty{text-align:center; padding:48px 20px; color:var(--ink-soft); font-size:14px;}

.efb5-card{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  overflow:hidden; animation:efb5In .25s ease;
}
@keyframes efb5In{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
.efb5-card-top{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:20px 22px; border-bottom:1px solid var(--border);
}
.efb5-name{font-size:17px; font-weight:600;}
.efb5-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.efb5-pct{text-align:right;}
.efb5-pct-num{font-size:26px; font-weight:700; line-height:1;}
.efb5-pct-label{font-size:11px; font-weight:600; margin-top:4px; padding:2px 9px; border-radius:20px; display:inline-block;}

.efb5-asof{font-size:11px; color:var(--ink-soft); padding:12px 10px 0;}
.efb5-table{padding:6px 10px;}
.efb5-row{
  display:grid; grid-template-columns:1fr 64px 46px; align-items:center;
  gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13.5px;
}
.efb5-row:last-child{border-bottom:none;}
.efb5-subj{font-weight:500;}
.efb5-frac{color:var(--ink-soft); font-size:12.5px; text-align:right;}
.efb5-pct-cell{font-weight:600; font-size:12.5px; text-align:right;}
.efb5-dash{color:var(--ink-soft); font-size:12.5px;}

.efb5-chart-wrap{padding:18px 22px 20px; border-top:1px solid var(--border);}
.efb5-chart-label{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:10px;}
.efb5-chart-wrap svg{width:100%; height:auto; display:block; overflow:visible;}
.efb5-chart-tick{font-size:9.5px; fill:var(--ink-soft); font-family:'Inter',sans-serif;}
.efb5-chart-ref{font-size:9px; fill:var(--ink-soft); font-family:'Inter',sans-serif;}
.efb5-chart-note{font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;}

/* results section */
.efb5-results-wrap{padding:18px 22px 22px; border-top:1px solid var(--border);}
.efb5-results-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.efb5-marks-status{font-size:10.5px; color:var(--ink-soft); margin-bottom:10px;}
.efb5-results-title{font-size:13px; font-weight:600; color:var(--ink);}
.efb5-results-badge{font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px;}
.efb5-res-row{
  display:grid; grid-template-columns:1fr 60px 60px 60px 70px; align-items:center;
  gap:8px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:12.5px;
}
.efb5-res-row.head{font-size:10.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
.efb5-res-row:last-child{border-bottom:none;}
.efb5-res-subj{font-weight:500;}
.efb5-res-mark{text-align:center; font-family:inherit;}
.efb5-res-mark.fail{color:var(--maroon); font-weight:700;}
.efb5-res-status{text-align:center; font-weight:700; font-size:11px;}
.efb5-res-status.pass{color:var(--green);}
.efb5-res-status.fail{color:var(--maroon);}
.efb5-res-note{font-size:11px; color:var(--ink-soft); margin-top:10px;}

@media (max-width: 480px){
  .efb5-res-row:not(.head){
    display:flex; flex-wrap:wrap; column-gap:16px; row-gap:5px; padding:10px 2px;
  }
  .efb5-res-row.head{display:none;}
  .efb5-res-row:not(.head) .efb5-res-subj{flex-basis:100%; margin-bottom:2px;}
  .efb5-res-row:not(.head) .efb5-res-mark,
  .efb5-res-row:not(.head) .efb5-res-status{text-align:left; font-size:12.5px;}
  .efb5-res-mark::before{content:attr(data-label) ": "; color:var(--ink-soft); font-weight:600; font-size:10.5px;}
  .efb5-res-status::before{content:"Status: "; color:var(--ink-soft); font-weight:600; font-size:10.5px;}
  .efb5-ov-tiles{grid-template-columns:repeat(2, 1fr);}
}
.efb5-res-remedial-tag{font-size:10px; font-weight:600; color:var(--blue-deep); margin-top:2px;}
.efb5-r-mark{color:var(--blue-deep); font-size:9px; margin-left:1px;}
.efb5-results-subnote{font-size:11.5px; color:var(--blue-deep); margin:-4px 0 10px;}

/* tabs */
/* overview */
.efb5-overview{padding:18px 22px; background:var(--bg);}
.efb5-ov-tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(90px, 1fr)); gap:10px; margin-bottom:16px;}
.efb5-ov-tile{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 8px; text-align:center;}
.efb5-ov-chart-label{font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px;}
.efb5-ov-chart-val{font-size:11px; font-weight:700; fill:var(--ink); font-family:'Inter',sans-serif;}
.efb5-ov-num{font-size:19px; font-weight:700; line-height:1;}
.efb5-ov-label{font-size:10px; color:var(--ink-soft); margin-top:5px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
.efb5-ov-bars{display:flex; flex-direction:column; gap:7px;}
.efb5-ov-bar-row{display:grid; grid-template-columns:44px 1fr 40px; align-items:center; gap:8px; font-size:11.5px;}
.efb5-ov-bar-label{font-weight:600; color:var(--ink);}
.efb5-ov-bar-track{background:var(--card); border:1px solid var(--border); border-radius:5px; height:14px; overflow:hidden;}
.efb5-ov-bar-fill{height:100%; border-radius:5px 0 0 5px; transition:width .3s ease;}
.efb5-ov-bar-empty{font-size:10px; color:var(--ink-soft); padding-left:6px; line-height:14px; font-style:italic;}
.efb5-ov-bar-frac{color:var(--ink-soft); text-align:right; font-size:11px;}

.efb5-tabs{display:flex; gap:4px; margin:14px 0 4px; border-bottom:1px solid var(--border);}
.efb5-tab{
  padding:9px 4px; font-size:13px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; cursor:pointer; border-bottom:2px solid transparent;
  margin-right:18px; font-family:'Inter',sans-serif;
}
.efb5-tab.active{color:var(--blue-deep); border-bottom-color:var(--blue);}
.efb5-pane{display:none;}
.efb5-pane.active{display:block;}
.efb5-sem-pane{display:none; padding-top:12px;}
.efb5-sem-pane.active{display:block;}
</style>
</head>

function parseCSV(text){
  var rows=[], row=[], field='', inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i], n=text[i+1];
    if(inQuotes){
      if(c==='"' && n==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function num(v){ var n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; }

// Column layout for the SEM-5 compiled sheet:
// 0 Roll, 1 Enrollment, 2 Name, 3 Division, 4 BrandDev, 5 %, 6 Case, 7 %, 8 Costing, 9 %,
// 10 DoingBiz, 11 %, 12 FBG1, 13 %, 14 FBIS, 15 %, 16 Strategic, 17 %, 18 Extra, 19 %,
// 20 Medical, 21 Bizzest, 22 Exam, 23 Other, 24 Attended, 25 TotalLectures, 26 %
function parseSheetRows(raw){
  var out = [];
  var maxima = null;
  var lecTotal = null;
  for(var i=0;i<raw.length;i++){
    var r = raw[i];
    if(!r || r.length<25) continue;
    var roll = parseInt(r[0],10);
    var name = (r[2]||'').trim();
    if(!roll || roll<1 || !name) continue;
    out.push({
      roll:roll, name:name, div:(r[3]||'A').trim() || 'A',
      branddev:num(r[4]), case:num(r[6]), costing:num(r[8]), doingbiz:num(r[10]),
      fbg1:num(r[12]), fbis:num(r[14]), strategic:num(r[16]), extra:num(r[18]),
      attended:num(r[24]), totalLec:num(r[25]), pct:num(r[26])
    });
  }
  if(out.length && out[0].totalLec) lecTotal = out[0].totalLec;
  for(var j=0;j<raw.length;j++){
    var hr = raw[j];
    if(hr && /lecture per subject/i.test(hr[2]||'')){
      maxima = {branddev:num(hr[4]), case:num(hr[6]), costing:num(hr[8]), doingbiz:num(hr[10]),
                fbg1:num(hr[12]), fbis:num(hr[14]), strategic:num(hr[16]), extra:num(hr[18])};
      break;
    }
  }
  return {students: out.length ? out : null, maxima: maxima, lecTotal: lecTotal};
}
function parseSheet(csvText){ return parseSheetRows(parseCSV(csvText)); }

// We don't have a confirmed gid/tab name for the compiled sheet, so instead of guessing once,
// scan a range of gids on each load, parse each candidate, and keep whichever valid result has
// the highest "total lectures" figure (a stale/older compiled snapshot in this workbook has a
// lower lecture count than the current one, so this self-corrects even if tabs get reordered).
function extractAsOfDate(text){
  // Sheet titles look like "Attendance Sem - 5 (Up to Date 18/07/2026) Batch-2024" -
  // pull that date out, but ignore obvious placeholder dates like 00/00/2023.
  var m = text.match(/Up to Date\s*(\d{2}\/\d{2}\/\d{4})/i);
  if(!m) return null;
  var parts = m[1].split('/');
  if(parts[0] === '00' || parts[1] === '00') return null;
  return m[1];
}

// The gviz/tq endpoint does not send CORS headers for plain fetch() calls from another origin -
// every browser silently blocks the response regardless of how correct the URL/gid is. Google's
// own docs specify script-tag injection (JSONP) as the intended cross-domain method, since
// <script src="..."> is not subject to the same-origin policy the way fetch()/XHR are. This is
// why every gviz request in this file goes through jsonpFetch rather than fetch().
var FETCH_TIMEOUT_MS = 10000;
var __jsonpCounter = 0;

function jsonpFetch(baseUrl){
  return new Promise(function(resolve){
    var cbName = '__gvizCB_' + (++__jsonpCounter) + '_' + Date.now();
    var settled = false;
    var scriptEl = null;

    function cleanup(){
      try{ delete window[cbName]; } catch(e){ window[cbName] = undefined; }
      if(scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
    }
    function finish(result){
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      cleanup();
      resolve(result);
    }

    var timer = setTimeout(function(){ finish(null); }, FETCH_TIMEOUT_MS);

    window[cbName] = function(response){
      finish(response);
    };

    try{
      var sep = baseUrl.indexOf('?') === -1 ? '?' : '&';
      var src = baseUrl + sep + 'tqx=out:json;responseHandler:' + cbName;
      scriptEl = document.createElement('script');
      scriptEl.src = src;
      scriptEl.onerror = function(){ finish(null); };
      document.head.appendChild(scriptEl);
    } catch(e){
      finish(null);
    }
  });
}

// Converts a google.visualization JSON table response into a plain array-of-arrays of string
// values, matching the shape parseCSV() would have produced - so every existing row-based parser
// (parseSheetRows, parseMarksRows, parseRemedialRows) works unchanged regardless of transport.
function gvizTableToRows(response){
  if(!response || response.status === 'error' || !response.table || !response.table.rows) return null;
  var cols = response.table.cols || [];
  return response.table.rows.map(function(row){
    var cells = row.c || [];
    var out = [];
    var width = Math.max(cells.length, cols.length);
    for(var i=0;i<width;i++){
      var cell = cells[i];
      if(!cell || cell.v===null || cell.v===undefined){ out.push(''); continue; }
      out.push(String(cell.v));
    }
    return out;
  });
}

// Fetches one gviz tab by gid and returns {rows, flatText} - flatText is a reconstructed blob
// (all cell values joined) so existing text-based checks (signature matching, "Up to Date" date
// extraction) keep working exactly as before, unchanged.
function fetchGvizTab(sheetId, gid){
  var url = "https://docs.google.com/spreadsheets/d/" + sheetId + "/gviz/tq?gid=" + gid;
  return jsonpFetch(url).then(function(response){
    var rows = gvizTableToRows(response);
    if(!rows) return null;
    // Google's JSON table auto-detects a header row and moves its labels into table.cols
    // rather than leaving them in table.rows (unlike a straight CSV export). Any text-presence
    // check needs to search both, or it'll miss labels that live in cols instead of rows.
    var colLabels = ((response.table && response.table.cols) || []).map(function(c){ return c.label || ''; }).join(',');
    var flatText = colLabels + '\n' + rows.map(function(r){ return r.join(','); }).join('\n');
    return {rows: rows, flatText: flatText};
  });
}

function fetchCandidate(gid){
  return fetchGvizTab(SHEET_ID, gid).then(function(result){
    if(!result) return null;
    // The structural check (>=20 valid roll+name rows found) is the real validity signal and
    // is robust regardless of how Google chose to split header text between rows and cols.
    var parsed = parseSheetRows(result.rows);
    if(!parsed.students || parsed.students.length < 20) return null;
    parsed.asOfDate = extractAsOfDate(result.flatText);
    return parsed;
  }).catch(function(){ return null; });
}

var attendanceAsOfDate = null;

// Overall watchdog: no matter what happens inside fetchLive's promise chain, force the UI out
// of "Syncing..." after a hard ceiling so it can never appear stuck.
function fetchLive(){
  setLive('loading','Syncing\u2026');
  var settled = false;
  var watchdog = setTimeout(function(){
    if(!settled){ settled = true; setLive('off','Offline \u00b7 showing saved data'); }
  }, FETCH_TIMEOUT_MS + 5000);
  // Confirmed gid for the compiled/summary tab - direct fetch, no scanning needed.
  fetchCandidate(ATTENDANCE_COMPILED_GID)
    .then(function(parsed){
      if(settled) return;
      if(!parsed) throw new Error('compiled sheet fetch failed');
      students = rowsToStudents(parsed.students.map(function(s){
        return [s.roll,s.name,s.div,s.branddev,s.case,s.costing,s.doingbiz,s.fbg1,s.fbis,s.strategic,s.extra,s.attended,s.pct];
      }));
      if(parsed.maxima) subjMax = parsed.maxima;
      if(parsed.lecTotal) totalLectures = parsed.lecTotal;
      attendanceAsOfDate = parsed.asOfDate || null;
      settled = true; clearTimeout(watchdog);
      var now = new Date();
      setLive('on','Live \u00b7 ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
    })
    .catch(function(){
      if(settled) return;
      settled = true; clearTimeout(watchdog);
      setLive('off','Offline \u00b7 showing saved data');
    });
}

// ---- Live marks + remedial sync ----
// Direct fetch of a known tab by its confirmed gid. The signature is checked against both rows
// and column labels (see fetchGvizTab) as a soft sanity guard; the real validity signal is the
// row-count check inside parseMarksRows/parseRemedialRows.
function fetchTabByGid(sheetId, gid, signature){
  return fetchGvizTab(sheetId, gid).then(function(result){
    if(!result) return null;
    return result.rows;
  });
}

function numVal(v){
  if(v===undefined || v===null) return null;
  v = String(v).trim();
  if(v==='') return null;
  var n = parseFloat(v.replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? null : n;
}

function parseMarksRows(rows, colMap){
  var out = {};
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var rollRaw = r[colMap.rollCol];
    var name = r[colMap.nameCol];
    var roll = parseInt(rollRaw,10);
    if(!roll || roll<1 || !name || !String(name).trim()) continue;
    var subj = {};
    var any = false;
    Object.keys(colMap.subjects).forEach(function(code){
      var idx = colMap.subjects[code];
      var mid = numVal(r[idx[0]]), proj = numVal(r[idx[1]]), univ = numVal(r[idx[2]]);
      subj[code] = {mid:mid, proj:proj, univ:univ};
      if(mid!==null || proj!==null || univ!==null) any = true;
    });
    if(any) out[roll] = {name:String(name).trim(), subjects:subj};
  }
  return Object.keys(out).length >= 20 ? out : null;
}
function parseMarksTab(csvText, colMap){ return parseMarksRows(parseCSV(csvText), colMap); }

function parseRemedialRows(rows, remMap){
  var out = {};
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var roll = parseInt(r[0],10);
    if(!roll || roll<1) continue;
    var mid = {}, univ = {};
    remMap.midOrder.forEach(function(code, j){
      var v = r[remMap.midStart+j];
      var n = numVal(v);
      if(n!==null) mid[code] = Math.floor(n/2+0.5); // round-half-up of raw/2, matching original marksheet's scaling
    });
    remMap.univOrder.forEach(function(code, j){
      var raw = r[remMap.univStart+j];
      if(raw===undefined || raw===null) return;
      var vs = String(raw).trim();
      if(vs==='') return;
      if(vs.toUpperCase()==='AB' || vs.toUpperCase()==='CANCEL') return;
      if(/pass/i.test(vs)){ univ[code] = 'CLEARED'; return; }
      var n = numVal(vs);
      if(n!==null) univ[code] = Math.floor(n/2+0.5);
    });
    out[roll] = {mid:mid, univ:univ};
  }
  return out;
}
function parseRemedialTab(csvText, remMap){ return parseRemedialRows(parseCSV(csvText), remMap); }

var MID_PASS = 10, PROJ_PASS = 10, UNIV_PASS = 20;

function computeLiveSemResults(marksData, remedialData, subjectOrder){
  var results = {};
  Object.keys(marksData).forEach(function(rollStr){
    var roll = parseInt(rollStr,10);
    var rec = marksData[rollStr];
    var rem = remedialData ? (remedialData[roll] || {mid:{}, univ:{}}) : {mid:{}, univ:{}};
    var subj = {};
    var overallPass = true;
    subjectOrder.forEach(function(code){
      var m = rec.subjects[code];
      if(!m) return;
      var origMid = m.mid||0, origProj = m.proj||0, origUniv = m.univ||0;
      var mid = origMid, proj = origProj, univ = origUniv;
      var midR = Object.prototype.hasOwnProperty.call(rem.mid, code);
      var univR = Object.prototype.hasOwnProperty.call(rem.univ, code);
      if(midR) mid = rem.mid[code];
      if(univR){
        univ = rem.univ[code]==='CLEARED' ? UNIV_PASS : rem.univ[code];
      }
      var origPass = (origMid>=MID_PASS) && (origProj>=PROJ_PASS) && (origUniv>=UNIV_PASS);
      var midPass = mid>=MID_PASS, projPass = proj>=PROJ_PASS, univPass = univ>=UNIV_PASS;
      var pass = midPass && projPass && univPass;
      if(!pass) overallPass = false;
      var clearedByRemedial = pass && !origPass && (midR||univR);
      subj[code] = [mid,proj,univ,midPass,projPass,univPass,pass,midR,univR,clearedByRemedial];
    });
    results[roll] = {p: overallPass?1:0, s: subj};
  });
  return results;
}

function fetchMarksLive(){
  if(typeof document === 'undefined' || typeof document.createElement !== 'function'){
    var elNoFetch = document.getElementById('efb5MarksStatus');
    window.__marksSyncStatusText = 'Marks: showing last known snapshot';
    if(elNoFetch) elNoFetch.textContent = window.__marksSyncStatusText;
    return;
  }
  var semPromises = [1,2,3,4].map(function(sem){
    var map = MARKS_COLUMN_MAP[sem];
    return fetchTabByGid(MARKS_SHEET_ID, map.gid, map.signature).then(function(rows){
      if(!rows) return null;
      try{
        var parsed = parseMarksRows(rows, map);
        return parsed ? {sem:sem, marks:parsed} : null;
      } catch(e){ return null; }
    }).catch(function(){ return null; });
  });
  var remPromises = [1,2].map(function(sem){
    var map = REMEDIAL_COLUMN_MAP[sem];
    return fetchTabByGid(REMEDIAL_SHEET_ID, map.gid, map.signature).then(function(rows){
      if(!rows) return null;
      try{
        return {sem:sem, remedial: parseRemedialRows(rows, map)};
      } catch(e){ return null; }
    }).catch(function(){ return null; });
  });

  Promise.all(semPromises.concat(remPromises)).then(function(all){
    var marksBySem = {}, remedialBySem = {};
    all.forEach(function(r){
      if(!r) return;
      if(r.marks) marksBySem[r.sem] = r.marks;
      if(r.remedial) remedialBySem[r.sem] = r.remedial;
    });
    var updatedAny = false;
    [1,2,3,4].forEach(function(sem){
      if(!marksBySem[sem]) return; // keep static snapshot for this semester
      try{
        var order = MARKS_COLUMN_MAP[sem].subjects;
        var subjectOrder = Object.keys(order);
        var live = computeLiveSemResults(marksBySem[sem], remedialBySem[sem] || null, subjectOrder);
        // only replace entries we actually got live data for, keep others (e.g. Sem5-not-yet-available) as null
        Object.keys(SEM_RESULTS[sem]).forEach(function(rollStr){
          if(live[rollStr] !== undefined) SEM_RESULTS[sem][rollStr] = live[rollStr];
        });
        updatedAny = true;
      } catch(e){ /* leave this semester's static snapshot untouched */ }
    });
    var marksSyncStatusText = updatedAny
      ? 'Marks last synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      : 'Marks: showing last known snapshot';
    window.__marksSyncStatusText = marksSyncStatusText;
    var marksStatusEl = document.getElementById('efb5MarksStatus');
    if(marksStatusEl) marksStatusEl.textContent = marksSyncStatusText;
  }).catch(function(){
    window.__marksSyncStatusText = 'Marks: showing last known snapshot';
    var marksStatusEl = document.getElementById('efb5MarksStatus');
    if(marksStatusEl) marksStatusEl.textContent = window.__marksSyncStatusText;
  });
}
function statusOf(pct){
  if(pct>=70) return {label:'Good standing', fg:'var(--green)', bg:'var(--good-bg)'};
  if(pct>=60) return {label:'Not eligible \u2014 1 subject', fg:'var(--gold)', bg:'var(--watch-bg)'};
  if(pct>=50) return {label:'Not eligible \u2014 2 subjects', fg:'var(--amber)', bg:'var(--amber-bg)'};
  return {label:'Not eligible \u2014 3 subjects', fg:'var(--maroon)', bg:'var(--risk-bg)'};
}
function pctColor(pct){
  if(pct>=75) return 'var(--green)';
  if(pct>=60) return 'var(--gold)';
  return 'var(--maroon)';
}
function overallColor(pct){
  if(pct>=70) return 'var(--green)';
  if(pct>=60) return 'var(--gold)';
  if(pct>=50) return 'var(--amber)';
  return 'var(--maroon)';
}

function buildTrendChart(s){
  var series = TREND_BY_ROLL[s.roll];
  if(!series || series.length<2) return '';
  var pts = series.map(function(pct,i){ return {label: DATES[i], pct: pct}; });

  var W=560, H=140, padL=8, padR=8, padT=10, padB=22;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  function x(i){ return padL + (i/(pts.length-1))*innerW; }
  function y(pct){ return padT + (1 - pct/100)*innerH; }

  function refLine(pct, label){
    var yy = y(pct);
    return '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#E5E9F0" stroke-width="1" stroke-dasharray="3,3"/>' +
           '<text class="efb5-chart-ref" x="'+(W-padR)+'" y="'+(yy-3)+'" text-anchor="end">'+label+'</text>';
  }

  var path = pts.map(function(p,i){ return (i===0?'M':'L')+x(i).toFixed(1)+','+y(p.pct).toFixed(1); }).join(' ');
  var dots = pts.map(function(p,i){
    return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.pct).toFixed(1)+'" r="2.6" fill="'+overallColor(p.pct)+'"/>';
  }).join('');
  // show a thinned-out set of date labels so they don't crowd
  var labelEvery = Math.ceil(pts.length/8);
  var ticks = pts.map(function(p,i){
    if(i % labelEvery !== 0 && i !== pts.length-1) return '';
    return '<text class="efb5-chart-tick" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+p.label+'</text>';
  }).join('');

  var medNote = MEDICAL_CREDIT[s.roll]
    ? '<div class="efb5-chart-note">Includes ' + MEDICAL_CREDIT[s.roll] + ' medical-leave session(s) credited on record, reflected at the most recent date.</div>'
    : '';

  return '' +
  '<div class="efb5-chart-wrap">' +
    '<div class="efb5-chart-label">Cumulative attendance across the semester so far</div>' +
    '<svg viewBox="0 0 '+W+' '+H+'">' +
      refLine(70,'70') + refLine(60,'60') + refLine(50,'50') +
      '<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2"/>' +
      dots + ticks +
    '</svg>' +
    medNote +
  '</div>';
}

function buildResultsSubTab(s, sem){
  var res = SEM_RESULTS[sem][s.roll];
  var meta = SEM_META[sem];
  if(res === null){
    return '<div class="efb5-empty" style="padding:24px 4px;">Semester '+sem+' marks aren\u2019t available yet.</div>';
  }
  var anyClearedByRemedial = false;
  var rows = meta.order.map(function(code){
    var d = res.s[code];
    if(!d) return '';
    var mid=d[0], proj=d[1], univ=d[2], midP=d[3], projP=d[4], univP=d[5], pass=d[6], midR=d[7], univR=d[8], clearedByRemedial=d[9];
    if(clearedByRemedial) anyClearedByRemedial = true;
    var clearedTag = clearedByRemedial ? '<div class="efb5-res-remedial-tag">Cleared via remedial</div>' : '';
    return '<div class="efb5-res-row">' +
      '<div class="efb5-res-subj">'+meta.names[code]+clearedTag+'</div>' +
      '<div class="efb5-res-mark'+(midP?'':' fail')+'" data-label="Mid Term">'+Math.ceil(mid)+'/25'+(midR?'<sup class="efb5-r-mark">R</sup>':'')+'</div>' +
      '<div class="efb5-res-mark'+(projP?'':' fail')+'" data-label="Project">'+Math.ceil(proj)+'/25</div>' +
      '<div class="efb5-res-mark'+(univP?'':' fail')+'" data-label="University">'+Math.ceil(univ)+'/50'+(univR?'<sup class="efb5-r-mark">R</sup>':'')+'</div>' +
      '<div class="efb5-res-status '+(pass?'pass':'fail')+'">'+(pass?'PASS':'FAIL')+'</div>' +
    '</div>';
  }).join('');

  var remedialNote = meta.hasRemedial
    ? 'Includes remedial attempts where taken (marked <sup>R</sup>) \u2014 remedial marks are halved from the raw exam score and rounded up, and replace the original mark for that component. Project can\u2019t be retaken via remedial, so it always shows the original mark.'
    : 'Remedial marks for this semester aren\u2019t available yet, so only original exam marks are shown.';

  var badgeLabel = res.p ? (anyClearedByRemedial ? 'CLEARED \u2014 VIA REMEDIAL' : 'CLEARED') : 'NOT CLEARED';
  var badgeSub = (res.p && anyClearedByRemedial)
    ? '<div class="efb5-results-subnote">One or more subjects passed only after a remedial attempt \u2014 see below.</div>'
    : '';

  return '' +
  '<div class="efb5-results-head">' +
    '<div class="efb5-results-title">Semester '+sem+' Results</div>' +
    '<div class="efb5-results-badge" style="'+(res.p?'color:var(--green);background:var(--good-bg)':'color:var(--maroon);background:var(--risk-bg)')+'">'+badgeLabel+'</div>' +
  '</div>' +
  badgeSub +
  '<div class="efb5-res-row head"><div>Subject</div><div>Mid Term</div><div>Project</div><div>University</div><div>Status</div></div>' +
  rows +
  '<div class="efb5-res-note">Pass mark: 40% in each of Mid Term, Project and University. Failing any one fails the subject, even if the other two are cleared. '+remedialNote+'</div>';
}

function buildResultsSection(s){
  var semTabs = [1,2,3,4].map(function(sem){
    return '<button class="efb5-tab'+(sem===1?' active':'')+'" data-sem="'+sem+'">Sem '+sem+'</button>';
  }).join('');
  var panes = [1,2,3,4].map(function(sem){
    return '<div class="efb5-sem-pane'+(sem===1?' active':'')+'" data-sem-pane="'+sem+'">'+buildResultsSubTab(s, sem)+'</div>';
  }).join('');

  return '' +
  '<div class="efb5-results-wrap">' +
    '<div id="efb5MarksStatus" class="efb5-marks-status">'+(window.__marksSyncStatusText || 'Marks: syncing\u2026')+'</div>' +
    '<div class="efb5-tabs" style="margin-top:0;">'+semTabs+'</div>' +
    panes +
  '</div>';
}

function buildOverview(s){
  var semStats = [1,2,3,4].map(function(sem){
    var res = SEM_RESULTS[sem][s.roll];
    var meta = SEM_META[sem];
    if(res === null) return {sem:sem, available:false};
    var total=0, passed=0;
    meta.order.forEach(function(code){
      var d = res.s[code];
      if(!d) return;
      total++;
      if(d[6]) passed++;
    });
    return {sem:sem, available:true, total:total, passed:passed, pct: total? Math.round(passed/total*100):0, cleared:res.p};
  });

  var availableSems = semStats.filter(function(x){ return x.available; });
  var semsCleared = availableSems.filter(function(x){ return x.cleared; }).length;
  var totalFailedSubjects = availableSems.reduce(function(acc,x){ return acc + (x.total - x.passed); }, 0);

  var tiles = '' +
    '<div class="efb5-ov-tile">' +
      '<div class="efb5-ov-num" style="color:'+overallColor(s.pct)+'">'+s.pct+'%</div>' +
      '<div class="efb5-ov-label">Attendance</div>' +
    '</div>' +
    '<div class="efb5-ov-tile">' +
      '<div class="efb5-ov-num" style="color:'+(semsCleared===availableSems.length?'var(--green)':'var(--maroon)')+'">'+semsCleared+'/'+availableSems.length+'</div>' +
      '<div class="efb5-ov-label">Semesters Cleared</div>' +
    '</div>' +
    '<div class="efb5-ov-tile">' +
      '<div class="efb5-ov-num" style="color:'+(totalFailedSubjects===0?'var(--green)':'var(--maroon)')+'">'+totalFailedSubjects+'</div>' +
      '<div class="efb5-ov-label">Subjects Failed</div>' +
    '</div>';

  var bars = semStats.map(function(x){
    if(!x.available){
      return '<div class="efb5-ov-bar-row">' +
        '<div class="efb5-ov-bar-label">Sem '+x.sem+'</div>' +
        '<div class="efb5-ov-bar-track"><div class="efb5-ov-bar-empty">Not yet available</div></div>' +
      '</div>';
    }
    var color = x.pct===100 ? 'var(--green)' : (x.pct>=50 ? 'var(--gold)' : 'var(--maroon)');
    return '<div class="efb5-ov-bar-row">' +
      '<div class="efb5-ov-bar-label">Sem '+x.sem+'</div>' +
      '<div class="efb5-ov-bar-track"><div class="efb5-ov-bar-fill" style="width:'+x.pct+'%;background:'+color+'"></div></div>' +
      '<div class="efb5-ov-bar-frac">'+x.passed+'/'+x.total+'</div>' +
    '</div>';
  }).join('');

  return '' +
  '<div class="efb5-overview">' +
    '<div class="efb5-ov-tiles">'+tiles+'</div>' +
    '<div class="efb5-ov-chart-label">Subjects passed, by semester</div>' +
    '<div class="efb5-ov-bars">'+bars+'</div>' +
  '</div>';
}

function getAttendanceAsOfLabel(){
  if(attendanceAsOfDate){
    // attendanceAsOfDate is DD/MM/YYYY from the live sheet's own title
    var parts = attendanceAsOfDate.split('/');
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var mi = parseInt(parts[1],10) - 1;
    if(mi>=0 && mi<12) return parts[0] + ' ' + months[mi] + ' ' + parts[2];
    return attendanceAsOfDate;
  }
  if(DATES && DATES.length) return DATES[DATES.length-1] + ' (last known snapshot)';
  return 'unknown';
}

        '<button class="efb5-tab active" data-tab="overview">Overview</button>' +
        '<button class="efb5-tab" data-tab="marks">Marks</button>' +
        '<button class="efb5-tab" data-tab="attendance">Attendance</button>' +
      '</div>' +
    '</div>' +
    '<div class="efb5-pane active" data-pane="overview">' +
      buildOverview(s) +
    '</div>' +
    '<div class="efb5-pane" data-pane="attendance">' +
      '<div class="efb5-asof">Attendance shown up to '+getAttendanceAsOfLabel()+'</div>' +
      '<div class="efb5-table">'+rows+'</div>' +
      buildTrendChart(s) +
    '</div>' +
    '<div class="efb5-pane" data-pane="marks">' +
      buildResultsSection(s) +
    '</div>' +
  '</div>';
}

function wireTabs(container){
  // top-level Attendance / Marks tabs
  var topTabsBar = container.querySelector('.efb5-tabs');
  if(topTabsBar){
    var topTabs = topTabsBar.querySelectorAll('.efb5-tab[data-tab]');
    Array.prototype.forEach.call(topTabs, function(tab){
      tab.addEventListener('click', function(){
        var name = tab.getAttribute('data-tab');
        Array.prototype.forEach.call(topTabs, function(t){ t.classList.toggle('active', t===tab); });
        Array.prototype.forEach.call(container.querySelectorAll('.efb5-pane'), function(p){
          p.classList.toggle('active', p.getAttribute('data-pane')===name);
        });
      });
    });
  }
  // semester sub-tabs inside the Marks pane
  var semTabsBar = container.querySelector('.efb5-results-wrap .efb5-tabs');
  if(semTabsBar){
    var semTabs = semTabsBar.querySelectorAll('.efb5-tab[data-sem]');
    var semPanes = container.querySelectorAll('.efb5-sem-pane');
    Array.prototype.forEach.call(semTabs, function(tab){
      tab.addEventListener('click', function(){
        var sem = tab.getAttribute('data-sem');
        Array.prototype.forEach.call(semTabs, function(t){ t.classList.toggle('active', t===tab); });
        Array.prototype.forEach.call(semPanes, function(p){
          p.classList.toggle('active', p.getAttribute('data-sem-pane')===sem);
        });
      });
    });
  }
}

var body = document.getElementById('efb5Body');
var loginPane = document.getElementById('efb5Login');
var sessionPane = document.getElementById('efb5Session');
var sessionName = document.getElementById('efb5SessionName');
var rollInput = document.getElementById('efb5LoginRoll');
var enrollInput = document.getElementById('efb5LoginEnroll');
var loginBtn = document.getElementById('efb5LoginBtn');
var loginErr = document.getElementById('efb5LoginError');
var logoutBtn = document.getElementById('efb5LogoutBtn');

function norm(v){ return String(v||'').trim().toLowerCase().replace(/\s+/g,''); }

function attemptLogin(){
  try{
    var roll = parseInt(rollInput.value.trim(), 10);
    var enrollEntered = norm(enrollInput.value);
    loginErr.style.display = 'none';

    if(!roll || !enrollEntered){
      loginErr.textContent = 'Please enter both your roll number and enrollment number.';
      loginErr.style.display = 'block';
      return;
    }
    var actualEnroll = ENROLL_MAP[roll];
    if(!actualEnroll || norm(actualEnroll) !== enrollEntered){
      loginErr.textContent = 'Roll number and enrollment number don\u2019t match our records. Please check and try again.';
      loginErr.style.display = 'block';
      return;
    }

    var s = students.filter(function(x){ return x.roll === roll; })[0];
    if(!s){
      loginErr.textContent = 'That roll number isn\u2019t in this batch\u2019s records.';
      loginErr.style.display = 'block';
      return;
    }

    var cardHtml;
    try{
      cardHtml = renderCard(s);
    } catch(renderErr){
      loginErr.textContent = 'Something went wrong showing your record. Please refresh the page and try again.';
      loginErr.style.display = 'block';
      return;
    }

    loginPane.style.display = 'none';
    sessionPane.style.display = 'block';
    sessionName.textContent = s.name + ' \u00b7 Roll ' + s.roll;
    body.innerHTML = cardHtml;
    try{ wireTabs(body); } catch(wireErr){ /* tabs may not switch, but the data itself is still visible */ }
  } catch(e){
    loginErr.textContent = 'Something went wrong. Please refresh the page and try again.';
    loginErr.style.display = 'block';
  }
}

loginBtn.addEventListener('click', attemptLogin);
enrollInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') attemptLogin(); });
rollInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') enrollInput.focus(); });

logoutBtn.addEventListener('click', function(){
  sessionPane.style.display = 'none';
  loginPane.style.display = 'block';
  rollInput.value = '';
  enrollInput.value = '';
  loginErr.style.display = 'none';
  body.innerHTML = '';
  rollInput.focus();
});

// Live sync is intentionally started last, after every button/input above is already wired up.
// If anything in the sync path throws unexpectedly (blocked network, restrictive in-app browser,
// etc.), the login form and the rest of the page are already fully functional regardless.
try{ fetchLive(); } catch(e){ setLive('off','Offline \u00b7 showing saved data'); }
try{ fetchMarksLive(); } catch(e){
  window.__marksSyncStatusText = 'Marks: showing last known snapshot';
  var marksStatusElInit = document.getElementById('efb5MarksStatus');
  if(marksStatusElInit) marksStatusElInit.textContent = window.__marksSyncStatusText;
}

})();
</script>

</body>
</html>
